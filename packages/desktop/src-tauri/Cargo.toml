[package]
name = "aide-desktop"
version = "0.1.0"
description = "AIDE_DEV desktop shell"
authors = ["Weiping Yan"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "aide_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aide-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
