name: desktop

# Builds the Windows installer. On a v* tag the installer is attached to a
# GitHub Release; otherwise it is kept as a workflow artifact.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      # shared + core (including the single-file engine the app bundles) + cli
      - run: pnpm build
      - run: pnpm --filter @aide/desktop tauri build
      # Install silently, start the installed app, and require that it finds
      # its bundled engine and gets a "ready" line from it.
      - name: Smoke test the installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem packages/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\AIDE_DEV" -Filter *.exe -Recurse | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { throw "installed app not found under $env:LOCALAPPDATA\AIDE_DEV" }
          Write-Host "starting $($exe.FullName)"
          $env:AIDE_SMOKE_TEST = '1'
          $p = Start-Process $exe.FullName -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: aide-dev-windows-installer
          path: packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
          body: |
            Windows installer for the AIDE_DEV desktop app, built by GitHub Actions from this tag.

            - Needs Node.js 22 or newer on PATH (the agent engine runs as a Node process).
            - The installer is not code-signed, so Windows SmartScreen will warn before it runs.
            - You bring your own API key (DeepSeek, Qwen, GLM, Kimi, Doubao, MiniMax or any OpenAI-compatible endpoint).
